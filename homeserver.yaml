  name: psycopg2
  args:
    user: synapse
    password: connect_local_12345
    database: synapse
    host: postgres
    port: 5432
    cp_min: 5
    cp_max: 10
log_config: "/data/localhost.log.config"
media_store_path: /data/media_store
registration_shared_secret: "CPN#wihXZV8,4XEf@h0wU3yfO@_eyEh8rt5T#^YUgUNz,IDn49"
report_stats: false
macaroon_secret_key: ".ph&An7*Ju_7RGHZiOx.XWx-S~.feo-r0Y,DQo2JYt1;Zx,7vC"
form_secret: "FL=fsmz&QUmI0=.w1F63nTj*AxZxXpLLHuM~,+^ZuFP#xl1Y.C"
signing_key_path: "/data/localhost.signing.key"
trusted_key_servers:
